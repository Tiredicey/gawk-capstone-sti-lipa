name: Publish Capstoney to Cloudflare
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the separate gawk-capstone-sti-lipa site and create/use its D1 database'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: capstoney-cloudflare-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Install and validate build before changing Cloudflare
        run: |
          npm ci
          node --check public/static/app.js
          node --check public/static/model.js
          git diff --exit-code 9c1a5b6 -- index.html
          npm run build
      - name: Prepare dedicated Pages project and production database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile, writeFile, appendFile} from 'node:fs/promises';
          const account = (process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          const token = (process.env.CLOUDFLARE_API_TOKEN || '').trim();
          const name = 'gawk-capstone-sti-lipa', dbName = name + '-db';
          const owner = 'Tiredicey/gawk-capstone-sti-lipa';
          if (!/^[a-f0-9]{32}$/i.test(account)) throw Error('Add CLOUDFLARE_ACCOUNT_ID as a GitHub Actions repository secret.');
          if (!/^[A-Za-z0-9_-]{20,}$/.test(token)) throw Error('Add CLOUDFLARE_API_TOKEN as a GitHub Actions repository secret.');
          if (process.env.GITHUB_REPOSITORY !== owner) throw Error('This workflow is scoped to the Capstoney repository.');
          async function api(path, method = 'GET', body, missing = false) {
            let r;
            try { r = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + path, {
              method, headers: {Authorization:'Bearer ' + token,'Content-Type':'application/json'},
              body:body ? JSON.stringify(body) : undefined, signal:AbortSignal.timeout(30000)
            }); } catch { throw Error('Cloudflare request timed out or failed. Inspect resources before rerunning.'); }
            if (r.status === 404 && missing) return null;
            let data; try { data = await r.json(); } catch { throw Error('Unreadable Cloudflare response.'); }
            if (!r.ok || data.success !== true) throw Error('Cloudflare rejected ' + method + ' ' + path.split('?')[0] + ' (HTTP ' + r.status + '). Check token permissions, account ID, quotas and name availability.');
            return data.result;
          }
          const config = JSON.parse(await readFile('wrangler.jsonc','utf8'));
          let project = await api('/pages/projects/' + name, 'GET', undefined, true);
          if (!project) {
            const settings = {compatibility_date:config.compatibility_date,env_vars:{CAPSTONEY_REPOSITORY:{type:'plain_text',value:owner}}};
            project = await api('/pages/projects','POST',{name,production_branch:'main',deployment_configs:{production:settings,preview:settings}});
          }
          if (project.source || project.production_branch !== 'main' || project.deployment_configs?.production?.env_vars?.CAPSTONEY_REPOSITORY?.value !== owner) throw Error('Existing project is not marked for this repository. Stopping to protect other sites.');
          if (!/^[a-z0-9-]+\.pages\.dev$/.test(project.subdomain || '')) throw Error('No valid Pages address returned.');
          let db;
          for (let page = 1; page <= 100; page++) {
            const list = await api('/d1/database?per_page=100&page=' + page);
            if (!Array.isArray(list)) throw Error('Unexpected database list response.');
            db = list.find(item => item.name === dbName);
            if (db || list.length < 100) break;
            if (page === 100) throw Error('Database list limit reached. Inspect the account manually.');
          }
          const bound = project.deployment_configs?.production?.d1_databases?.DB?.id;
          if (bound && (!db || db.uuid !== bound)) throw Error('Existing production DB differs or is missing. Stopping without replacing it.');
          if (!db) db = await api('/d1/database','POST',{name:dbName});
          if (!/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/i.test(db.uuid || '')) throw Error('Invalid D1 identifier returned.');
          config.name = name;
          config.vars = {...config.vars,CAPSTONEY_REPOSITORY:owner};
          config.d1_databases = [{binding:'DB',database_name:dbName,database_id:db.uuid,migrations_dir:'migrations'}];
          await writeFile('wrangler.jsonc',JSON.stringify(config,null,2) + '\n');
          await appendFile(process.env.GITHUB_ENV,'CAPSTONEY_URL=https://' + project.subdomain + '\n');
          console.log('Pages and D1 prepared. Configuration changes stay in this temporary runner.');
          NODE
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply gawk-capstone-sti-lipa-db --remote
      - name: Set Heisenbot intake token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTAKE_TOKEN: ${{ secrets.INTAKE_TOKEN }}
        run: |
          if [ -z "$INTAKE_TOKEN" ]; then echo "INTAKE_TOKEN secret not set; Heisenbot posting stays off."; exit 0; fi
          if [ ${#INTAKE_TOKEN} -lt 24 ]; then echo "INTAKE_TOKEN must be at least 24 characters."; exit 1; fi
          printf '%s' "$INTAKE_TOKEN" | npx wrangler pages secret put INTAKE_TOKEN --project-name gawk-capstone-sti-lipa
      - name: Build with production binding
        run: npm run build
      - name: Publish this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name gawk-capstone-sti-lipa --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Check home page and D1 health
        run: |
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          const url = process.env.CAPSTONEY_URL;
          if (!/^https:\/\/[a-z0-9-]+\.pages\.dev$/.test(url || '')) throw Error('Invalid deployment address.');
          let healthy = false;
          for (let i = 0; i < 8; i++) {
            try {
              const r = await fetch(url + '/api/health',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              const data = await r.json();
              healthy = r.ok && data.ok === true && data.storage === 'D1';
              if (healthy) break;
            } catch {}
            await new Promise(resolve => setTimeout(resolve,5000));
          }
          if (!healthy) throw Error('Upload finished, but database health is unconfirmed. Check Cloudflare logs.');
          const page = await fetch(url,{signal:AbortSignal.timeout(15000)});
          if (!page.ok || !(await page.text()).includes('Your proposal board')) throw Error('Expected application page not found.');
          await appendFile(process.env.GITHUB_STEP_SUMMARY,'## Capstoney is published\n\nOpen [' + url + '](' + url + ').\n\nPublished commit: ' + process.env.GITHUB_SHA + '\n\nHome page and D1 health passed. Test adding a proposal and export a backup.\n');
          NODE
